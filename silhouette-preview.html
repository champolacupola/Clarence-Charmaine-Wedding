<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attire Section Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f0e8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }

    .attire-card {
      background: #fdf8ee;
      max-width: 860px;
      width: 100%;
      position: relative;
      overflow: hidden;
      padding: 3.5rem 3rem 3rem;
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    /* Watercolor blush blobs */
    .attire-card::before {
      content: '';
      position: absolute;
      top: -60px; left: -60px;
      width: 300px; height: 300px;
      background: radial-gradient(ellipse, rgba(201,162,39,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .attire-card::after {
      content: '';
      position: absolute;
      bottom: -40px; right: 200px;
      width: 260px; height: 200px;
      background: radial-gradient(ellipse, rgba(201,162,39,0.07) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* === Left content === */
    .attire-content {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .attire-script-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.8rem;
      color: #7a5c1e;
      line-height: 1.1;
      margin-bottom: 1.4rem;
    }

    .attire-body {
      font-family: 'Lato', sans-serif;
      font-weight: 400;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5a3e10;
      line-height: 2;
      margin-bottom: 1.6rem;
    }

    .attire-body strong {
      display: block;
      font-weight: 400;
    }

    /* Brush stroke swatches */
    .swatches {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .swatch-brush {
      display: block;
    }

    .color-label {
      font-family: 'Lato', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #8a6820;
      margin-top: 0.2rem;
    }

    /* === Right figures === */
    .attire-figures {
      display: flex;
      align-items: flex-end;
      gap: 0.2rem;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    /* === Botanical leaves === */
    .leaf-tl {
      position: absolute;
      top: 0; left: 0;
      opacity: 0.55;
      pointer-events: none;
    }
    .leaf-bl {
      position: absolute;
      bottom: 0; left: 0;
      opacity: 0.45;
      pointer-events: none;
    }

    .note { font-size: 0.6rem; color: #bbb; text-align: center; margin-top: 1rem; letter-spacing: 0.05em; }
  </style>
</head>
<body>
